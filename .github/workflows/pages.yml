# Publishes site/ to plume.sprintmob.com.
#
# scripts/install.sh is copied in at deploy time rather than committed under
# site/, so the file people pipe into a shell and the file in the repo cannot
# drift. Configure the custom domain in GitHub Pages settings and DNS; this
# GitHub Actions deployment does not need a site/CNAME file.
name: pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "scripts/install.sh"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: assemble
        run: |
          mkdir -p _site
          cp -R site/. _site/
          cp scripts/install.sh _site/install.sh

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
