name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build and sign Plume.app
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: swift version
        run: swift --version

      - name: cache SwiftPM
        uses: actions/cache@v4
        with:
          path: |
            .build
            ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      # Tier 0. Ad-hoc, no Apple account needed, which is what ships today.
      # bundle.sh builds, strips before signing (after invalidates
      # CodeResources and macOS then calls the app damaged), and verifies.
      #
      # PLUME_VERSION is passed explicitly rather than left to git describe, so
      # a release never depends on how deep the checkout fetched.
      - name: bundle
        env:
          PLUME_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '0.0.0' }}
        run: |
          VERSION="${PLUME_VERSION#v}"
          PLUME_VERSION="$VERSION" ./scripts/bundle.sh --output dist --arch arm64

      # Tier 1. Everything below is conditioned on the certificate existing, so
      # turning it on later is adding two secrets rather than rewriting this
      # file. Until then the release is ad-hoc signed and the README says so.
      - name: import the Developer ID certificate
        if: ${{ secrets.MACOS_CERTIFICATE_P12 != '' }}
        env:
          CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ github.run_id }}
        run: |
          echo "$CERTIFICATE_P12" | base64 --decode > /tmp/certificate.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security import /tmp/certificate.p12 -k build.keychain \
            -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: \
            -s -k "$KEYCHAIN_PASSWORD" build.keychain
          rm -f /tmp/certificate.p12

      - name: sign and notarize
        if: ${{ secrets.MACOS_CERTIFICATE_P12 != '' }}
        env:
          SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          NOTARY_PROFILE: ${{ secrets.MACOS_NOTARY_PROFILE }}
        run: |
          codesign --force --options runtime --timestamp \
            --entitlements packaging/plume.entitlements \
            --sign "$SIGN_IDENTITY" dist/Plume.app
          codesign --verify --strict --verbose=2 dist/Plume.app
          ditto -c -k --sequesterRsrc --keepParent dist/Plume.app dist/notarize.zip
          xcrun notarytool submit dist/notarize.zip \
            --keychain-profile "$NOTARY_PROFILE" --wait
          xcrun stapler staple dist/Plume.app
          rm -f dist/notarize.zip

      # zip via ditto rather than tar.gz, and the decisive reason is forward
      # looking: xcrun notarytool accepts only .zip, .pkg and .dmg, so tar.gz
      # would mean rewriting this step the day a Developer ID arrives.
      # --sequesterRsrc preserves the extended attributes the signature seal
      # lives in; --keepParent keeps Plume.app as the top-level entry rather
      # than exploding Contents/ into the working directory.
      - name: package
        run: |
          cd dist
          ditto -c -k --sequesterRsrc --keepParent Plume.app plume-macos-arm64.zip
          shasum -a 256 plume-macos-arm64.zip > plume-macos-arm64.zip.sha256
          ls -lh

      - name: release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/plume-macos-arm64.zip
            dist/plume-macos-arm64.zip.sha256
          generate_release_notes: true
          fail_on_unmatched_files: true
