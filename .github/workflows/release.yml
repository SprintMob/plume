name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    name: package Plume for Apple Silicon
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      # Fail before spending build time; public tags never fall back to ad hoc.
      - name: require public release credentials
        if: github.ref_type == 'tag'
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          MACOS_NOTARY_PROFILE: ${{ secrets.MACOS_NOTARY_PROFILE }}
          MACOS_NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          MACOS_NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
          MACOS_NOTARY_APP_PASSWORD: ${{ secrets.MACOS_NOTARY_APP_PASSWORD }}
        run: |
          for name in MACOS_CERTIFICATE_P12 MACOS_CERTIFICATE_PASSWORD MACOS_SIGN_IDENTITY MACOS_NOTARY_PROFILE MACOS_NOTARY_APPLE_ID MACOS_NOTARY_TEAM_ID MACOS_NOTARY_APP_PASSWORD; do
            [ -n "${!name:-}" ] || { echo "required release secret is absent: $name" >&2; exit 1; }
          done
          case "$MACOS_SIGN_IDENTITY" in
            "Developer ID Application:"*) ;;
            *) echo "Developer ID Application identity required" >&2; exit 1 ;;
          esac
      - name: swift version
        run: swift --version
      - uses: actions/cache@v4
        with:
          path: |
            .build
            ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-
      - name: tests
        run: swift test
      - name: signed and notarized public artifacts
        if: github.ref_type == 'tag'
        env:
          PLUME_VERSION: ${{ github.ref_name }}
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          MACOS_NOTARY_PROFILE: ${{ secrets.MACOS_NOTARY_PROFILE }}
          MACOS_NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          MACOS_NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
          MACOS_NOTARY_APP_PASSWORD: ${{ secrets.MACOS_NOTARY_APP_PASSWORD }}
        run: |
          export PLUME_VERSION="${PLUME_VERSION#v}"
          ./scripts/release-signed.sh
      - name: local ad-hoc artifacts (not notarized)
        if: github.ref_type != 'tag'
        env:
          PLUME_VERSION: 0.0.0
        run: |
          ./scripts/bundle.sh --output dist --arch arm64
          ./scripts/dmg.sh --app dist/Plume.app --output dist
          cd dist
          ditto -c -k --sequesterRsrc --keepParent Plume.app plume-macos-arm64.zip
          shasum -a 256 plume-macos-arm64.zip > plume-macos-arm64.zip.sha256
          shasum -a 256 plume-macos-arm64.dmg > plume-macos-arm64.dmg.sha256
      - name: publish
        uses: softprops/action-gh-release@v2
        if: github.ref_type == 'tag'
        with:
          files: |
            dist/plume-macos-arm64.zip
            dist/plume-macos-arm64.zip.sha256
            dist/plume-macos-arm64.dmg
            dist/plume-macos-arm64.dmg.sha256
          generate_release_notes: true
          fail_on_unmatched_files: true
          prerelease: ${{ contains(github.ref_name, '-') }}
