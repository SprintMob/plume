<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- The inverse, for the README and social images. Both are legal, since
       lime is a fill in each. Black wins for the app icon because it matches
       the only other place the mark is seen, the dictation pill, and because
       the product is a daemon that is silent until you press a key. A
       saturated lime tile shouting from the Dock would say the opposite.
       Shouting is correct in a README. -->
